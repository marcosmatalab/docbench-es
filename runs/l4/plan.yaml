# PLAN DE FIXTURES DE L4 · congelado ANTES de ver ni una tabla.
#
# Mismo argumento que el plan de cosecha de L3: quien elige la muestra, quien
# transcribe y quien escribe el codigo son LA MISMA PERSONA. La semilla es lo unico
# que impide que la seleccion acabe siendo "las que salieron bien".

hito: L4
criterio: "La verdad derivada reproduce las tablas a mano"   # §16, literal

# ------------------------------------------------------- DE DONDE SALE LA MUESTRA
# El censo del corpus, con su sello. Si el sello no cuadra, la seleccion no es
# reproducible: el corpus de tablas CAMBIO el 24 ago 2026 al arreglar el grupo de
# filas —BOE-A-2026-7193 t0 paso de 13x5 a 14x4 y las tablas fatales de 2 a 0—, asi
# que un fixture elegido del censo viejo no describe este corpus.
censo: docs/censo-corpus-1000.json
censo_sello: 525c71d

# ------------------------------------------------------------- LA POBLACION
# NO son los 1.000 documentos del corpus: 662 no tienen ni una tabla, y elegir
# sobre 1.000 haria que dos de cada tres extracciones cayeran en un documento sin
# tabla. La poblacion es la que tiene el objeto que se mide.
poblacion:
  documentos_con_tabla: 338
  tablas: 2135
  # LA UNIDAD ES EL DOCUMENTO (regla de oro 3: las preguntas de un mismo documento
  # estan correlacionadas, asi que lo que se remuestrea son documentos). De cada
  # documento elegido sale UNA tabla, tambien por semilla: si se tomaran todas, el
  # documento de 332 tablas dominaria la muestra el solo.
  # MUESTREO EN DOS ETAPAS, y describirlo mal fue un defecto real del plan:
  #   unidad PRIMARIA:   el documento — es a esta a la que se aplica la estratificacion
  #   unidad SECUNDARIA: una tabla dentro del documento, elegida por la semilla
  # Asi que NO son «30 tablas estratificadas»: son 30 DOCUMENTOS estratificados por
  # sus seis celdas, con una tabla por documento. La diferencia muerde: el estrato
  # `celdas-combinadas` etiqueta al DOCUMENTO —lo calcula boe_xml.estratos sobre el
  # XML entero— asi que garantiza que ALGUNA tabla del documento tiene spans, no
  # que los tenga la sorteada. Medido en BOE-A-2026-6204: documento en
  # `celdas-combinadas`, tabla elegida sin un solo span.
  #
  # No es un defecto del diseño: es muestreo en dos etapas, que es legitimo. Lo que
  # era un defecto era el nombre. Y se compensa PUBLICANDO LA DISTRIBUCION QUE
  # SALIO —cuantas de las 30 tienen rowspan>1, colspan>1, su reparto de tamaños y
  # bandas—, que sale gratis del censo. Un instrumento descrito vale mas que uno
  # que promete lo que no da.
  unidad_primaria: documento
  unidad_secundaria: tabla
  estratificacion_se_aplica_a: unidad_primaria
  tablas_por_documento_elegido: 1
  publicar_distribucion_realizada: true

# ------------------------------------------------------------- LA ESTRATIFICACION
# Sobre lo ya medido, no sobre "40 tablas variadas". Los cuatro estratos se reducen
# a DOS aqui y no es una simplificacion: `sin-tabla` (629) y `anexo-png` (33) son
# exactamente los 662 documentos SIN tabla, asi que no pueden aportar una.
# Proporcional a la poblacion, redondeado para que sume 30.
objetivo: 30
estratos:
  - {estrato: tabla-simple,       banda: corto, poblacion: 80, n: 7}
  - {estrato: celdas-combinadas,  banda: medio, poblacion: 65, n: 6}
  - {estrato: celdas-combinadas,  banda: largo, poblacion: 65, n: 6}
  - {estrato: celdas-combinadas,  banda: corto, poblacion: 47, n: 4}
  - {estrato: tabla-simple,       banda: medio, poblacion: 45, n: 4}
  - {estrato: tabla-simple,       banda: largo, poblacion: 36, n: 3}

# Las bandas son las de ADR-0034, definidas antes de que el corpus existiera.
bandas: {corto: [1, 4], medio: [5, 12], largo: [13, null]}

# --------------------------------------------------------------------- LA SEMILLA
# Congelada aqui y commiteada antes de correr `elegir_fixtures.py` ni una vez. Sin
# esto, "no me gusta esta tabla, tiro otra vez" no deja rastro.
semilla: 20260824

# ------------------------------------------------------- DE DONDE SE TRANSCRIBE
# DEL PDF, NO DEL XML. La verdad se DERIVA del XML, asi que transcribir del XML
# seria comparar el XML consigo mismo y el criterio pasaria por construccion. Es la
# decision que hace el hito no circular.
fuente_de_la_transcripcion: pdf

# --------------------------------------------------- LAS QUE YA SE HABIAN VISTO
# Cuatro tablas del corpus se inspeccionaron a mano al arreglar el grupo de filas.
# NO se excluyen —excluirlas sesgaria la estratificacion— pero se declaran, y si
# alguna cae en la muestra se publica al lado del numero.
ya_inspeccionadas:
  - BOE-A-2026-7193   # el derrame de grupo de filas
  - BOE-A-2026-7172   # el gemelo horizontal del colgroup
  - BOE-A-2026-5542   # SPAN_FUERA_DE_RANGO, antes del arreglo
  - BOE-A-2026-6080   # idem

# ----------------------------------------------------------------- LA ADJUDICACION
# ADR-0039, escrito antes que esto. Resumen operativo:
#   1. orden de sospecha: primero el codigo, segundo la transcripcion
#   2. cada discrepancia se adjudica una a una, con su causa publicada
#   3. el numero separa "fallo del codigo" de "error de transcripcion"
#   4. si el codigo se arregla, se RE-COMPARAN LAS 30
adjudicacion: docs/adr/0039-la-adjudicacion-de-discrepancias-de-la-verdad.md

# --------------------------------------------------------------- EL ALCANCE
# Las 30 tablas suman 2.283 celdas y TRES son el 54% del trabajo. Se transcriben
# COMPLETAS todas menos las que pasen del umbral; esas llevan ventana.
#
# LA VENTANA ES LA CABEZA, FIJA, NO SORTEADA. Razon: la estructura vive en los
# BORDES —cabeceras, spans que cruzan secciones, fronteras de <thead>/<tbody>—, y el
# fallo que este hito caza ocurre EN una frontera de seccion. Una ventana sorteada
# cae en el medio, que es donde las tablas son regulares, y submuestrea justo donde
# estan los bugs. La objecion obvia —«eliges la parte facil»— se contesta sola: la
# cabeza es la parte DIFICIL, asi que el sesgo va hacia la region dura, que es la
# direccion segura para un banco.
#
# Y TAMBIEN LA ULTIMA FILA, que son 21 celdas en total —gratis— y cubre la otra
# region donde vive la estructura: hueco de cola, fila de totales, cierre de <tbody>.
alcance:
  umbral_celdas: 100          # por encima, ventana; por debajo, completa
  ventana_filas_de_cuerpo: 6  # mas las filas de cabecera que tenga
  incluye_ultima_fila: true
  # Con el umbral de 100 sobre esta seleccion: 27 completas y 3 con ventana.
  ventaneadas: [BOE-A-2026-5975, BOE-A-2026-6732, BOE-A-2026-6388]

# LA DIMENSION COMPLETA SE COMPRUEBA EN LAS 30, ventaneadas incluidas: n_rows x
# n_cols contadas a ojo sobre el PDF. Es lo que recupera lo que la ventana no ve, y
# es exactamente donde estaba el fallo del grupo de filas —13x5 contra 14x4—.
dimension_completa_en_las_30: true

# ------------------------------------------------------------- LA VELOCIDAD MEDIDA
# Punto 6: medir antes de comprometer la estimacion, que es el metodo del piloto de
# L3 aplicado a mi. Dos tablas cronometradas de reloj, localizacion incluida:
#   BOE-A-2026-7560 t12 · 36 celdas · 37 s   (sin spans, 1 pagina de 175)
#   BOE-A-2026-6204 t3  · 42 celdas · 30 s   (1 pagina de 12)
# ~33 s por tabla, DOMINADO POR EL COSTE FIJO de localizar y leer la pagina, no por
# las celdas. Extrapolado a 30: ~20-30 min. O sea que CABE en las 8-10 h del hito.
#
# LO QUE ESO NO DICE, y es lo que de verdad ata: se ha medido VELOCIDAD, no
# EXACTITUD. En una tabla de 600 celdas leidas de una imagen la restriccion no es el
# reloj sino MI TASA DE ERROR, que sube en la cola larga, y cada error mio gasta una
# discrepancia que no habla del producto. Por eso la ventana se queda aunque el
# tiempo sobre. **Mi tasa de error transcribiendo NO esta medida** — haria falta una
# segunda pasada ciega, que es lo que ADR-0039 descarta por coste.

# ------------------------------------------------- COMO SE LOCALIZO CADA UNA
# Si el proceso no es el mismo en las 30, mi tasa de error tampoco lo es. Cada
# fixture anota `localizacion` con uno de tres valores, y en la adjudicacion ese
# dato esta ahi para ponderar una discrepancia:
#   automatica                     el localizador dio la pagina y habia una sola tabla
#   automatica_con_desambiguacion  dio la pagina, pero habia varias y elegí por dimension
#   a_ojo                          no dio ancla; hubo que buscarla leyendo el PDF
localizacion_declarada_por_fixture: true

# ------------------------------------------------ LO QUE LA TRANSCRIPCION MIDE GRATIS
# `cruza_pagina` por fixture. El limite 32 dice que las paginas NO se derivan del
# XML, asi que `multipagina` es un estrato declarado que el proyecto no puede medir
# desde el origen. Transcribiendo del PDF se mide sin coste extra, y es la primera
# cifra empirica sobre multipagina del proyecto. Va con su n y su intervalo: es la
# MUESTRA, no el corpus.
medir_cruza_pagina: true

# Y las 30 se transcriben de una sentada y se congelan con hash ANTES de la primera
# comparacion. El sello de esa congelacion se escribe aqui cuando ocurra.
sello_de_la_congelacion: be6f5e0
congelacion: runs/l4/congelacion.json
congelado_en: 2026-08-24T22:45:00Z
# 30 transcritas, 1.213 celdas, 27 completas y 3 con ventana. NINGUNA se habia
# comparado contra truth.derived cuando se congelaron: ese es el punto entero.
