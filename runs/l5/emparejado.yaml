# COMO SE EMPAREJA UNA TABLA EXTRAIDA CON SU TABLA DE REFERENCIA
# Escrito ANTES de escribir el codigo que empareja, y ANTES de ver un solo TEDS.
#
# `core.teds.teds_batch` recibe tripletas `(clave, predicha, real)` y dice en su propio
# docstring que emparejar es trabajo de quien llama. Nadie lo ha decidido todavia, y es
# una decision que mueve el titular: con el mismo extractor y la misma verdad, dos reglas
# de emparejado dan dos TEDS distintos.

hito: L5
decide: que tabla extraida se compara con que tabla de la verdad derivada
usa: core.teds.teds_batch, core.cellmatch

# ------------------------------------------------- LO QUE NO SE PUEDE USAR, Y POR QUE
no_se_puede_emparejar_por_pagina: >
  La verdad de L5 es DERIVED: sale del XML del BOE, y el XML NO TIENE PAGINAS. El limite
  32 lo dice desde L1: «page_span no es derivable de un XML, lo pone quien llama». Asi
  que el `page_span` del lado de la verdad no es informacion, es un relleno — y
  emparejar por el seria emparejar por un campo inventado.

# --------------------------------------------------------------------- LA REGLA
regla:
  cual: POR ORDEN, Y SOLO CUANDO LOS RECUENTOS COINCIDEN
  definicion: >
    Si el extractor devuelve N tablas para un documento y la verdad tiene M:
    · N == M  -> se emparejan por orden de aparicion, la k-esima con la k-esima, y el
                 documento puntua TEDS.
    · N != M  -> el documento NO PUNTUA TEDS. Sale NO_APLICABLE, nunca 0,00, y su
                 discrepancia se cuenta en la columna de deteccion.
  por_que_solo_con_recuentos_iguales: >
    Porque el modo de fallo del emparejado por orden es CATASTROFICO Y SISTEMATICO: un
    extractor que se salta la primera tabla compara su tabla 2 contra la 1 de la verdad,
    su 3 contra la 2, y saca notas ruinosas en TODAS por un solo fallo de deteccion.
    Eso no mide calidad de extraccion: mide un desalineamiento. Publicarlo como TEDS
    seria un cero falso con mas decimales.
  por_que_NO_APLICABLE_y_no_cero: >
    Decision B3, y la regla de oro 4. «No se pudo comparar» y «se comparo y salio mal»
    son cosas distintas, y un 0,00 solo puede significar que se midio cero. La cobertura
    evaluable va SIEMPRE al lado del agregado, que es lo que impide leer la nota de un
    extractor con cobertura del 40% como si fuera la de uno con cobertura del 95%.

# ------------------------------------------------------- LA ALTERNATIVA DESCARTADA
descartada:
  cual: emparejado voraz por maximo TEDS
  que_seria: >
    Para cada tabla predicha, buscar entre las M de la verdad la que le da mas nota, y
    quedarse con esa. Es lo que hacen algunos bancos.
  por_que_no:
    - >
      SE PUNTUA A SI MISMO. La asignacion se elige MAXIMIZANDO la metrica que luego se
      publica: un extractor que emite las tablas en desorden sale igual de bien que uno
      que las emite en orden, y el desorden es un defecto real para quien consume la
      salida.
    - >
      Cuesta N x M evaluaciones de TEDS por documento. Con 28,7 tablas por documento en
      la banda >50, son ~823 arboles por documento y por extractor.
    - >
      Y el numero deja de ser reproducible por lectura: para saber que se comparo con
      que hay que reejecutar la optimizacion.

# ------------------------------------------- LO QUE SE PUBLICA AL LADO, Y NO ES ADORNO
deteccion:
  columnas:
    documentos_con_recuento_igual: cuantos de los 338 tienen N == M. ES la cobertura.
    tablas_de_mas: sum(max(0, N - M)) sobre los 338
    tablas_de_menos: sum(max(0, M - N)) sobre los 338
  por_que: >
    Porque «cuantas tablas encuentra» NO ES CALIDAD y no ordena a nadie. Un extractor que
    parte una tabla en tres encuentra mas; uno que fusiona dos encuentra menos y puede
    estar acertando. Sin la verdad al lado, el recuento es un numero que se lee como
    calidad sin serlo — la misma clase que un 0,00 de anclaje.
    Con la verdad al lado, deja de ser un recuento y pasa a ser un ACUERDO, que si
    significa algo.
  y_por_eso_la_tabla_del_humo_no_ordena_a_nadie: >
    121, 118, 118 y 112 tablas sobre los 12 del humo NO dicen que pdfplumber sea mejor.
    Dicen cuantos objetos devolvio cada uno. Va escrito aqui para que no se cuele como
    titular.

# ============================================================================
# EL SESGO DE SUPERVIVENCIA QUE TRAE ESTA REGLA, Y COMO SE CIERRA
# Anadido el 27 ago 2026, CON LA CORRIDA TRABAJANDO Y ANTES DE VER UN SOLO TEDS.
# ============================================================================
sesgo_de_supervivencia:
  cual: >
    Con N != M el documento sale NO_APLICABLE. Correcto — pero mira A QUIEN BENEFICIA:
    un extractor que DETECTA MAL las tablas falla el recuento en mas documentos, y esos
    documentos salen de SU cuenta. Asi que su TEDS se calcula solo sobre los documentos
    donde ACERTO EL RECUENTO, que son sus documentos faciles. CUANTO PEOR DETECTA, MAS SE
    LE EXCLUYE, Y MEJOR PINTA LO QUE QUEDA.
  y_va_a_pasar_seguro: >
    Medido en el humo, sobre los MISMOS 12 documentos: 121, 118, 118 y 112 tablas. Los
    cuatro fallan el recuento en documentos DISTINTOS, asi que cada uno puntuaria sobre un
    subconjunto distinto ELEGIDO POR EL MISMO. Comparar cuatro TEDS calculados asi es el
    2.283 con otra cara.
  lo_que_NO_basta: >
    Que `evaluable_coverage` viaje pegado a `teds` —decidido en §6 y antes de esto— hace
    el sesgo LEGIBLE, no lo quita. Y la cifra que se cita es la comparacion entre
    extractores, no el TEDS suelto.

# --------------------------------------------------------- LOS DOS AGREGADOS
# No es una segunda medida: son las MISMAS puntuaciones con dos denominadores.
agregados_publicados:
  por_extractor:
    sobre: su propio conjunto evaluable, con su cobertura al lado
    contesta: >
      "¿que tal va CUANDO acierta el recuento?"
    por_que_se_publica: >
      Porque un extractor que acierta poco pero bien es informacion real, y perderla por
      protegerse del sesgo seria tirar el dato para salvar la comparacion.
  cara_a_cara:
    sobre: >
      LA INTERSECCION: los documentos donde TODOS los extractores comparados acertaron el
      recuento. Mismo subconjunto para todos, n declarado.
    contesta: >
      "¿cual es mejor?" — y es la UNICA que puede contestarla.
    por_que: >
      Mata la objecion de supervivencia para el numero que se cita. Con el mismo
      denominador para los cuatro, «mejor» vuelve a significar algo.
  y_la_n_de_la_interseccion_es_un_dato: >
    Si de 338 documentos los cuatro coinciden en el recuento en 150, eso dice algo sobre
    la dificultad del corpus que NINGUNA nota de TEDS dice. Se publica siempre, tambien
    —y sobre todo— si sale baja.

# ------------------------------------------------ LO QUE NO SE VA A AFIRMAR
lo_que_no_se_afirma_con_esto: >
  UN RANKING. La cara a cara pone a los cuatro sobre el mismo denominador, que es
  necesario, pero NO es suficiente: decir «A es mejor que B» exige la comparacion pareada
  con su potencia, que es literalmente lo que L6 existe para hacer (McNemar y bootstrap
  agrupado por documento, ADR-0009). Hasta entonces se publican los numeros y su n, y no
  se ordena a nadie.
  Elegir umbral de n AHORA seria inventarse una potencia sin calcularla.

# ------------------------------------------------------------------ SI SALE MAL
si_la_cobertura_sale_muy_baja: >
  ES UN RESULTADO, NO UNA RAZON PARA CAMBIAR LA REGLA. Significaria que los extractores
  no coinciden con la referencia ni en CUANTAS tablas hay, que es un hallazgo mas gordo
  que cualquier TEDS. Se publica la cobertura, se publica la deteccion, y se dice.
  Cambiar la regla despues de ver el numero es elegir el que conviene.

# ------------------------------------------------------------------ LO QUE NO CUBRE
no_cubre:
  - >
    Tablas que cruzan pagina. La verdad derivada no las marca y ningun extractor las
    reconstruye: si una tabla real sale partida en dos en la extraccion, cuenta como
    recuento distinto y el documento no puntua. Es conservador y esta declarado.
  - >
    El ORDEN de la verdad derivada es el del XML. Se supone que es el de lectura, y no
    esta comprobado contra el PDF para los 338 — solo para las 30 de L4.

# ============================================================================
# EL ACUERDO DE RECUENTO ES UNA FUNCION DEL PANEL, Y SOLO SABE BAJAR
# Anadido el 28 ago 2026, ANTES de que entre el quinto extractor y por tanto ANTES de
# que el numero se mueva. Escribirlo despues seria explicar una caida ya publicada.
# ============================================================================
el_titular_depende_del_panel:
  que_es: >
    «En N de 338 documentos los extractores coinciden con la referencia en CUANTAS TABLAS
    HAY» es una INTERSECCION sobre tantos conjuntos como extractores tenga el panel. Con
    cuatro son cuatro conjuntos; con cinco, cinco.
  la_monotonia: >
    Anadir un extractor SOLO PUEDE BAJARLO, nunca subirlo. Un documento que estaba en la
    interseccion sigue exigiendo que los cuatro de antes acierten, mas el nuevo: la
    condicion se endurece y el conjunto solo puede encoger. ES MONOTONO POR CONSTRUCCION,
    NO POR CALIDAD.
  la_consecuencia_que_hay_que_impedir: >
    L5 cierra con CUATRO y los otros cuatro entran de uno en uno con /extractor. Cuando
    entren, el titular BAJARA, y una serie de dos valores con paneles distintos se lee
    como que el corpus empeoro o como que la extraccion va peor. Seria exactamente la
    clase de error que este hito acaba de corregir —un numero con la etiqueta de otra
    cuenta— pero diferido: el fallo no estaria en el numero de hoy sino en la comparacion
    de mañana, y para entonces nadie tendra delante el contexto para verlo.
  la_regla:
    - >
      EL PANEL VA EN LA ETIQUETA, no en una nota al pie: «N de 338 sobre el panel de K,
      [nombres]». Sin el panel, el numero no esta completo.
    - >
      DOS VALORES CON PANELES DISTINTOS NO SON COMPARABLES y NO van en la misma serie ni
      en la misma tabla de evolucion. Si alguien quiere comparar, la unica comparacion
      legitima es recalcular el panel viejo sobre la corrida nueva, que se puede porque
      los diarios estan y el aritmetico es puro.
    - >
      LO IMPRIME EL INSTRUMENTO, no el que escribe. `report.tables` emite el panel con sus
      nombres y la frase de la monotonia; `runs/l5/informe.json` lo lleva como dato en
      `acuerdo.panel`. Lo fija tests/unit/test_tabla_nivel1.py.
  lo_que_esto_NO_dice: >
    Que el numero no sirva. Sirve, y es el titular del hito: dice cuanta base comun hay
    para comparar en ESTE panel. Lo que no admite es una flecha entre dos paneles.
