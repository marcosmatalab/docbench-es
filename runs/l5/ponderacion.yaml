# COMO SE PROMEDIA EL TEDS EN LA TABLA DE L5 · escrito ANTES de medir nada
#
# La pregunta la abre un numero del censo: los 38 documentos de mas de 50 paginas son
# el 3,8% de los DOCUMENTOS y el 36,6% de las PAGINAS. Con esa asimetria, «el TEDS medio»
# no es una cosa: son tres cosas distintas que dan tres numeros distintos.
#
#   por documento        -> los 38 largos pesan 3,8%. La tabla habla de documentos cortos.
#   ponderado por pagina -> los largos pesan 36,6%. Se parece a lo que siente quien
#                           procesa un boletin entero.
#   por tabla            -> pesa cada tabla igual, venga de donde venga.
#
# Las tres son defendibles. Elegir DESPUES de ver los numeros no lo es.

hito: L5
decide: cual es el TEDS agregado primario de la tabla de resultados

# ------------------------------------------------------- EL CENSO DE TABLAS
# Medido DESPUES de escribir la decision y ANTES de puntuar nada. No la cambia; la
# refuerza, y anade un numero que hay que publicar al lado del agregado.
#   comando: uv run python scripts/censo_tablas.py
censo_de_tablas:
  documentos_con_alguna_tabla: 338 de 1.000 (33,8%)
  tablas_totales: 2.135
  la_n_efectiva: >
    EL TEDS AGREGADO SE PROMEDIA SOBRE 338 DOCUMENTOS, NO SOBRE 1.000. Los otros 662 no
    tienen ni una tabla: salen NO_APLICABLE y no puntuan (decision B3). Publicar «el TEDS
    medio del corpus» sin decir esto seria dar por medida una poblacion que no se midio.
  por_banda: >
    <=10: 192 de 776 con tabla, 516 tablas (24,2%) · 11-50: 114 de 186, 702 (32,9%) ·
    >50: 32 de 38, 917 tablas (43,0%), a 28,7 tablas por documento con tabla.
  lo_que_esto_le_hace_a_la_media_por_tabla: >
    LA REMATA. 32 documentos —el 9,5% de los que puntuan— cargarian el 43% del peso, y
    uno solo de ellos pesaria como 28 documentos cortos. La media por tabla ya estaba
    descartada por contradecir la regla de oro 3; este censo dice ademas cuanto habria
    distorsionado, que es lo que convierte un argumento en un numero.

# ------------------------------------------------------------------- PRIMARIA
primaria:
  cual: MEDIA POR DOCUMENTO, sin ponderar
  definicion: >
    TEDS de un documento = media de los TEDS de sus tablas. TEDS agregado = media de los
    TEDS de los documentos. Un documento sin tablas no puntua: sale NO_APLICABLE, nunca
    0,00. Ver la decision B3.
  por_que_esta:
    - >
      EL DOCUMENTO ES LA UNIDAD DE MUESTREO Y LA DE REMUESTREO. La regla de oro 3 del
      repo dice que el bootstrap remuestrea DOCUMENTOS porque las preguntas de un mismo
      documento estan correlacionadas. Un estimador cuya unidad coincide con la unidad
      del bootstrap es el unico cuyo intervalo significa lo que dice. Con la media por
      tabla, el punto y el intervalo hablarian de poblaciones distintas.
    - >
      Es la que se puede comparar hacia fuera: los bancos de extraccion de tablas
      publican media por documento, y un numero que no se puede comparar vale menos.
    - >
      No la distorsiona la longitud, que es una propiedad del corpus y no del extractor.

# ------------------------------------------------------------------ SECUNDARIA
secundaria:
  cual: PONDERADA POR PAGINAS
  definicion: "suma sobre documentos de (paginas x TEDS del documento) / suma de paginas"
  se_publica: al lado de la primaria, en la misma tabla, con su nombre
  por_que_se_publica_igual: >
    Porque contesta la pregunta del que procesa un boletin entero, que es un lector real
    de esto, y porque NO CUESTA UNA SEGUNDA MEDIDA: son los mismos TEDS con otros pesos.
    Publicar las dos ahorra que nadie tenga que fiarse de la eleccion.
  si_las_dos_se_separan_mucho: >
    Es un RESULTADO, no un problema: significa que el extractor se comporta distinto en
    documentos largos, y eso es justo lo que la tabla por bandas existe para ensenar.

# ------------------------------------------------------------------ DESCARTADA
descartada:
  cual: MEDIA POR TABLA
  por_que_no: >
    Contradice la regla de oro 3 EN EL MISMO REPO QUE LA HACE CUMPLIR EN EL BOOTSTRAP.
    Las tablas de un documento estan correlacionadas —mismo maquetador, misma fuente,
    mismo tipo de rejilla—, asi que tratarlas como observaciones independientes infla la
    n efectiva y estrecha el intervalo sin motivo. Y un documento con 40 tablas pesaria
    40 veces mas que uno con una, sin que nadie lo haya decidido.
  cuando_si_aparece: >
    El recuento de tablas por documento SI se publica, como descriptivo del corpus. Lo
    que no se hace es promediar TEDS sobre el. Ver censo_de_tablas, arriba.

# ------------------------------------------------------------------ EL LIMITE
no_cubre: >
  Ninguna de las dos arregla que el agregado sea un numero solo. La tabla POR BANDAS es
  la que ensena la dependencia con la longitud, y el agregado es una comodidad. Si algun
  dia hay que elegir entre publicar el agregado o las bandas, se publican las bandas.

# =============================================================================
# LA UNIDAD DE COBERTURA ES LA PAGINA, NO EL DOCUMENTO · anadido el 26 ago 2026
# =============================================================================
# Escrito ANTES de congelar el diseño de la tabla, y lo abre un numero: sobre los 12
# documentos del humo —668 paginas—, `pymupdf4llm` hizo 264 pasadas de OCR y `pdfplumber`
# ninguna (limite 104). O sea que sobre los MISMOS documentos, uno leyo paginas que el
# otro no pudo leer.
unidad_de_cobertura:
  decision: la PAGINA
  regla: >
    Si un extractor no puede leer una pagina, esa pagina es NO_APLICABLE PARA EL. La
    comparacion de calidad ocurre sobre las paginas que los dos pudieron leer, y la
    diferencia se declara AL LADO.
  por_que_no_el_documento: >
    Comparar 118 tablas contra 121 cuando uno vio 668 paginas y el otro 404 es comparar
    sobre denominadores distintos sin decirlo. Es el 2.283 otra vez: la cobertura
    evaluable de L4 se publico porque el denominador no era el que parecia.
  lo_que_esto_impide: >
    Un cero falso. Hoy `pdfplumber` pierde las paginas escaneadas de un documento y
    registra CERO fallos, porque `no_text_layer` solo salta si el documento entero se
    queda sin texto. B3 existe literalmente para prohibir eso: «un 0,00 solo puede
    significar que se midio cero».
  lo_que_hace_falta_antes: >
    El censo de paginas sin capa de texto del corpus. Sin el no se sabe si las 264 son
    paginas escaneadas —y entonces pymupdf4llm lee lo que pdfplumber no puede— o paginas
    digitales —y entonces pymupdf4llm esta haciendo trabajo innecesario y encima peor—.
    Son conclusiones opuestas y solo el censo las separa.
  y_la_promesa_que_protege: >
    La tasa de fallo por extractor es lo que el README promete en su punto 5 CON ESTE
    HITO. Publicarla con ceros silenciosos seria incumplir una promesa con hito asignado.
