# EL SOBRE TERMICO DE B5-bis · escrito ANTES de volver a medir
#
# 2026-08-25. La primera version de scripts/computo_l5.py corrio los cuatro
# extractores en UN solo proceso, sin limite de hilos: docling carga torch, torch cogio
# los 8 procesadores que WSL ve, y la CPU del usuario llego a 85 grados. Dentro de
# especificacion para un 9950X3D (Tjmax 95, corte termico 115) pero por encima de lo
# que el usuario quiere que su maquina haga.
#
# ESTO CAMBIA EL NUMERO QUE B5-bis MIDE, y por eso se declara aqui y no se calla:
# segundos de RELOJ con 6 hilos y pausas NO son el coste minimo de esta maquina.

hito: L5
mide: B5-bis
por_que_va_aparte_de_computo_yaml: >
  runs/l5/computo.yaml es la REGLA DE DECISION, commiteada sola antes de medir. Editarla
  ahora para meterle condiciones de ejecucion ensuciaria un pre-registro. Las condiciones
  van en su propio fichero, con su propia fecha.

# ------------------------------------------------------------------ EL SOBRE
# 2026-08-25, revision 2. El primer sobre era 80/72, y ese numero no tenia dato
# detras: era una precaucion. AMD documenta que el procesador esta disenado para
# funcionar a TJMax —~95 grados— de forma CONTINUA sin deterioro, y el silicio se
# frena solo antes de sufrir. 90/82 deja 5 grados de colchon sobre el punto donde el
# fabricante dice que puede vivir permanentemente.
limites:
  techo_c: 90          # a partir de aqui el gobernador manda SIGSTOP al hijo
  reanudar_c: 84       # y SIGCONT al bajar de aqui
  objetivo_media_c: 82 # la media de la sesion, descansos incluidos
  resolucion_s: 2.0    # cada cuanto se lee el termometro. Es la resolucion del control.

carga:
  # 8, que es TODO lo que WSL ve en esta maquina (32 logicos en el anfitrion). Con el
  # techo en 90 no hace falta dejar margen por miedo: lo acota la medicion.
  hilos_con_termometro: 8
  hilos_sin_termometro: 2     # a ciegas: se compensa con menos carga, no con promesas
  # pausa ENTRE unidades = trabajo x factor, adaptada por la media de la sesion. Ya
  # NO es la barrera de carga —lo es el ciclo—, asi que es la misma con y sin
  # termometro: a ciegas valia 1,0 y duplicaba la sesion sin anadir seguridad.
  descanso_base: 0.15
  descanso_tope_s: 120
  prioridad: nice -n 19
  afinidad: taskset -c 0-(hilos-1)
  # RED DE SEGURIDAD, no metodo de muestreo. Ver censura. Esta definido A
  # hilos_con_termometro y ESCALA con los hilos que se usen de verdad: es un tope de
  # RELOJ sobre un trabajo paralelo, asi que a la mitad de hilos tarda el doble y un
  # tope fijo censuraria por ir despacio en vez de por colgarse.
  #     tope efectivo = tope_unidad_min x hilos_con_termometro / hilos_en_uso
  tope_unidad_min: 20

# ------------------------------------------- POR QUE HAY UN CICLO DE TRABAJO
# NI LAS VARIABLES DE ENTORNO NI taskset ACOTAN ESTA CARGA. Medido con tres
# instrumentos y no supuesto:
#   · pymupdf4llm arrastra rapidocr, cuyo ONNX Runtime abre 45 HEBRAS.
#   · Con taskset -c 0-1, /proc/PID/status dice Cpus_allowed_list: 0-1 —esa es la mascara
#     de la hebra lider— y `top` marca 600% de CPU: las hebras trabajadoras se reescriben
#     su propia afinidad una a una y se salen de la mascara del proceso.
#   · os.wait4 y /usr/bin/time coinciden: 484% de CPU con 2 CPU en la mascara.
#   · El control positivo descarta que sea el instrumento: 8 PROCESOS girando bajo
#     taskset -c 0-1 dan 2,11 hilos efectivos, y sin taskset dan 8,38. taskset funciona;
#     lo que no funciona es taskset CONTRA UNA BIBLIOTECA QUE SE REPONE LA AFINIDAD.
# cgroup v2 con el controlador cpu existe en esta maquina, pero /sys/fs/cgroup no es
# escribible sin root. Asi que el tope duro se hace con lo unico que si esta disponible.
ciclo:
  que_es: >
    El gobernador para el proceso con SIGSTOP una fraccion de cada periodo y lo reanuda
    con SIGCONT. Acota el consumo MEDIO de CPU pase lo que pase con las hebras, porque no
    depende de cuantas haya sino de cuanto rato se les deja correr.
  periodo_s: 2.0
  fraccion_con_termometro: 0.60
  fraccion_sin_termometro: 0.30
  latido_s: 0.02              # resolucion del ciclo. Con periodo 2,0 el error es ~3%
  no_distorsiona_el_numero: >
    El tiempo parado se acumula en pausado_s y se resta: trabajo_s = reloj - pausado_s.
    Asi que el s/pagina publicado es el que habria salido sin ciclo. Lo que el ciclo
    alarga es la SESION, no la medida.
  la_afirmacion_ES_FALSABLE: >
    cpu_s / reloj_s <= fraccion x 8 nucleos. Se comprueba con los datos que el propio
    gobernador guarda, en cada unidad. Si alguna unidad la incumple, el ciclo no esta
    acotando y hay que decirlo en vez de suponerlo.

# ------------------------------------------------------------- LA CENSURA
# El documento mas largo del corpus son 309 paginas. docling sobre eso es UNA unidad
# indivisible de posiblemente una hora: la carga sostenida que hay que evitar, y lo
# contrario de estar partido. No se esconde: se CENSURA POR LA DERECHA.
censura:
  QUE_CAMBIO: >
    La revision 1 de este fichero decia que censurar el documento de 309 paginas
    «basta, porque B5-bis no pregunta cuanto cuesta sino SI CABE». ERA FALSO, y de tres
    formas distintas. Se deja escrito porque el error importa mas que la correccion.
  fallo_1_supervivencia: >
    Excluir las censuradas de la mediana la sesga A LA BAJA: solo contribuyen las
    rapidas. Es sesgo de supervivencia, y justo en el sitio donde esta el coste.
  fallo_2_la_pregunta_es_una_suma: >
    «Cabe?» no es una pregunta sobre la MEDIANA sino sobre la SUMA. Una suma construida
    desde una mediana sesgada a la baja esta mal dos veces.
  fallo_3_la_cota_solo_decide_en_un_sentido: >
    Una cota inferior valida decide SI YA NO CABE. Si sale que cabe, no se sabe nada,
    porque lo censurado puede reventarlo. La mitad de los desenlaces queda sin contestar.
  fallo_4_el_tercio_del_computo: >
    Y el mas grave: los 38 documentos de mas de 50 paginas son el 3,8% de los documentos
    y el 36,6% de las PAGINAS. Censurarlos no recorta la cola: tira el tercio que decide.
  que_se_hace_ahora: >
    El metodo esta en runs/l5/estimacion.yaml: coste por PAGINA medido por bandas sobre
    documentos de tamano representativo, y total por suma ponderada por las paginas de
    cada banda. Ninguna unidad deberia pasar de unos minutos.
  para_que_queda_el_tope: >
    Como RED DE SEGURIDAD contra un extractor que se cuelga, no como metodo. Si salta,
    es un fallo que hay que mirar, y la unidad se registra censurada=true para que se
    vea. Con el metodo nuevo no deberia saltar nunca.
  el_tiempo_pausado_no_cuenta: >
    El tope se mide sobre reloj MENOS pausado_s. Un proceso parado por el gobernador no
    estaba trabajando, y penalizarlo por enfriar la maquina seria medir la refrigeracion.

# ------------------------------------------------- LA MONEDA, Y POR QUE CAMBIA
# Revision 2: SON DOS MONEDAS Y CONTESTAN PREGUNTAS DISTINTAS. La revision 1 decia
# «primaria: segundos de CPU» y con eso habria contestado «cabe?» en la moneda que NO
# contesta esa pregunta.
moneda:
  segundos_de_cpu:
    que_contesta: cuanto COMPUTO consume. Es la pregunta de la factura en la nube.
    como_se_mide: ru_utime + ru_stime del hijo, via os.wait4
    invariante_a: el numero de hilos, el SIGSTOP y el ciclo de trabajo
  reloj_de_pared:
    que_contesta: «termina esta noche?». ES LA PREGUNTA DE B5-bis.
    como_se_mide: reloj menos pausado_s, o sea trabajo efectivo
    depende_de: el numero de hilos, y por eso NUNCA se publica sin el al lado
  la_que_decide: >
    EL RELOJ, evaluado al numero de hilos con el que se correria de verdad. Un «cabe»
    calculado en segundos de CPU no es un «cabe».
  el_puente: >
    reloj ~= segundos de CPU / hilos efectivos. Por eso cada medida guarda
    hilos_efectivos = cpu_s / trabajo_s MEDIDO, no el configurado: pdfplumber es
    monohilo y docling no, asi que el efectivo es distinto en cada fila y es lo unico
    que permite reescalar el reloj a otro numero de trabajadores.
  no_publicable: >
    Un s/pagina de reloj sin decir con cuantos hilos se midio. Seria una cifra desnuda.

# ------------------------------------------------------------ LO QUE NO ACOTA
no_acota:
  - >
    La temperatura cuando NO hay termometro. Si HKCU\Software\HWiNFO64\VSB no existe,
    el gobernador se declara «vigilado: false», baja a 2 hilos y NO afirma ningun grado.
  - >
    La frecuencia de boost. Desde WSL no se toca; con pocos hilos el boost sube el
    voltaje por nucleo, asi que menos hilos NO baja la temperatura de forma lineal.
  - >
    Lo que hagan otros procesos de la maquina. La carga se anota, no se controla.
