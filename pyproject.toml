[project]
name = "docbench-es"
version = "0.0.1"
description = "Banco de extracción documental en español, adaptable a cualquier entidad"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# `httpx` entra con L3 y vive en UN solo fichero, `src/docbench_es/entity/boe_api.py`.
# El contrato de capas lo prohibe en `core` (.importlinter), que es donde importa.
dependencies = ["benchcore==0.1.*", "pydantic>=2", "typer>=0.12", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
extract-local = ["pymupdf4llm", "pdfplumber", "camelot-py", "docling", "marker-pdf", "unstructured"]
ocr = ["pytesseract", "paddleocr", "surya-ocr"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2",
    # PARALELIZA LA PUERTA. Medido antes de adoptarlo, que es la regla: 1,88x sobre
    # `pytest tests/unit` —mediana 5591 ms en serie contra 2973 en paralelo, n=5 cada
    # una, 8 nucleos, `.hypothesis` borrada entre corridas—. El umbral escrito antes
    # de medir era 1,5x. Ver ADR-0043 y la LINEA DE CORTE de docs/metrics.md: la serie
    # longitudinal de la puerta tiene una discontinuidad aqui, y las dos medidas del
    # MISMO arbol estan publicadas para que el salto sea atribuible al instrumento.
    "pytest-xdist>=3",
    "types-pyyaml>=6.0.12.20260815",
    # Para SACAR TEXTO DE UN PDF en la comprobacion de coherencia del emparejado.
    # Va en dev y no en `dependencies` a proposito: `src/` no importa ninguna
    # libreria de PDF —`corpus.harvest` recibe los textos inyectados— y este texto
    # NO puntua a nadie, asi que la regla de oro 1 sigue en pie: es preparacion de
    # corpus, no un extractor del banco.
    "pypdf>=5",
]

# benchcore es una dependencia PROPIA. Existe un paquete AJENO llamado igual en
# PyPI: sin esta seccion, `uv sync` instala el de otra persona en silencio.
# Apunta esto a tu repo antes del primer `uv sync`.
[tool.uv.sources]
benchcore = { git = "https://github.com/marcosmatalab/benchcore", branch = "main" }

[project.scripts]
# EL ENTRY POINT SE RETIRA HASTA L5, que es quien escribe la CLI.
# El ejecutable estaba declarado apuntando a un modulo de CLI que no existe, y
# lanzarlo reventaba con ModuleNotFoundError: un ejecutable prometido que no existe es
# exactamente lo que la regla que gobierna este repo llama el fallo más grave.
# Las dos salidas eran retirarlo o crear un `main.py` con un `--help` que dijera
# «todavía no»; se elige retirarlo porque este repo tiene una sección entera de
# «Construido y NO VALIDADO» por adelantarse, y un stub es exactamente eso.
# Encontrado en la auditoría en frío de `a0d85ed`. Vuelve con L5 y con su CLI.

# Los adaptadores propios entran por el MISMO mecanismo que los de un cliente.
# Los dos grupos de entry points nacen VACIOS a proposito, y cada linea vuelve
# CON SU FICHERO. ADR-0036: el descubrimiento falla CERRADO, asi que un entry
# point que apunta a un modulo inexistente no es una declaracion de intenciones,
# es un `ModuleNotFoundError` que rompe el descubrimiento ENTERO de su grupo.
# Comprobado ejecutandolo el 23 ago 2026: los cinco que habia aqui fallaban.
#
#   docbench.entity     generico-pdf   -> cuando exista su fichero; ADR-0032 solo
#                                         garantiza que el contrato no le cierra
#                                         la puerta, no lo construye
#   docbench.extractor  oracle, pymupdf4llm, docling -> vuelven en L5
#
# `boe` ya volvio: su fichero existe y pasa la suite de conformidad.

[project.entry-points."docbench.entity"]
boe = "docbench_es.entity.boe:BoeAdapter"
#
# Sin ninguna linea, el grupo se descubre sin error y devuelve cero adaptadores,
# que es exactamente la verdad de hoy. El nombre del grupo no se pierde: vive en
# `docbench_es.entity.registry.GRUPO` y en ADR-0036.

[tool.ruff]
# DONDE ESTA EL CODIGO DE PRIMERA PARTE, DICHO Y NO ADIVINADO. Sin esto, `ruff` infiere
# la seccion de cada import y **infiere distinto en entornos distintos**: con la misma
# version 0.16.4, el mismo pyproject.toml (mismo md5) y el mismo fichero byte a byte,
# aqui exigia `censo_paginas` y `unidad_computo` JUNTOS y en un clon limpio los exigia
# SEPARADOS por una linea en blanco. O sea que NO habia forma del codigo que pasara en
# los dos, y la puerta dejaba de ser una propiedad del repositorio.
# Es la misma familia que los stubs de `extract-local` en mypy: un resultado que depende
# de una condicion no declarada. La condicion se declara.
src = ["src", "scripts", "tests/unit"]
line-length = 100
# Ruff 0.16 formatea el codigo Python dentro de los .md. Los manuales llevan
# snippets elididos a proposito, asi que sin esto la puerta se pone roja por
# culpa de la documentacion y `make fix` reescribiria MANUAL.md.
extend-exclude = ["*.md"]
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","N","UP","B","SIM","RUF","ANN","PTH","RET","ARG","C4"]
# N818 exige sufijo `Error`. El manual declara literalmente PolicyViolation,
# ContractViolation y BudgetExceeded, y CLAUDE.md dice que manda el manual.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# LOS FICHEROS SELLADOS NO SE REORDENAN. `runs/l4/congelacion_comparador.json` guarda su
# SHA-256, y el sello vale porque es a nivel de byte: una linea en blanco de mas lo
# rompe igual que un cambio de logica, y eso es una propiedad, no un defecto.
# Declarar `src` cambio la clasificacion de `comparar_verdad` a primera parte y `ruff`
# quiso separar el bloque de imports. Se revierte el fichero y se le exime la regla:
# la alternativa era re-sellar por comodidad, que es exactamente lo que el congelado
# prohibe. `git checkout` de un congelado es siempre la respuesta correcta.
#
# CUANDO CADUCA: estas tres exenciones mueren con el sello que las justifica. El dia que
# `runs/l4/congelacion_comparador.json` se re-corte por una razon legitima —y re-cortar
# un sello es una decision del usuario, no una comodidad—, hay que BORRAR estas tres
# lineas en el mismo commit. Si no, los tres ficheros quedan fuera del orden de imports
# para siempre y nadie se acuerda de por que. Lo hace cumplir
# tests/unit/test_congelados_l4.py, que se pondria rojo antes.
"tests/unit/test_comparar_verdad.py" = ["I001"]   # sellado en congelacion_comparador.json
"scripts/comparar_verdad.py" = ["I001"]           # sellado en congelacion_comparador.json
"src/docbench_es/truth/derived.py" = ["I001"]     # sellado en congelacion_comparador.json
# Los dobles de test implementan un Protocol: sus argumentos existen para
# cumplir la firma, no para usarse.
"tests/**" = ["ARG002", "ARG001"]
# Los mutantes de `scripts/mutantes/` son codigo ROTO A PROPOSITO. Su firma la
# dicta el protocolo de plugin de pytest —`config` no se usa nunca— y su cuerpo
# tiene que ser deliberadamente incorrecto: un mutante bien escrito no mata a
# nadie. Se excluyen de ARG y ANN, y de nada mas.
"scripts/mutantes/*.py" = ["ARG001", "ARG005", "ANN001", "ANN202"]

[tool.mypy]
python_version = "3.12"
# Layout src/. Sin estas tres lineas, mypy sube el arbol buscando la raiz del
# paquete hasta salirse del repo y llegar al directorio actual. Si por el camino
# encuentra un `__init__.py` suelto, revienta con
#   " contains __init__.py but is not a valid Python package name"
# (nombre vacio, de ahi el espacio inicial), o con "Source file found twice under
# different module names". Con `explicit_package_bases`, el crawl PARA en src/.
# Reproducido y verificado con mypy 2.3.1.
# `scripts` va aqui porque `tests/unit/test_ancla.py` importa `scripts/ancla.py`:
# la precondicion de los documentos publicados vive en `scripts/` —su consumidor
# es el script de un solo uso— y su test tiene que poder importarla con tipos.
mypy_path = "src:tests/unit:scripts"
explicit_package_bases = true
namespace_packages = true
strict = true
warn_unreachable = true
disallow_any_explicit = true

# LAS BIBLIOTECAS DE `extract-local` NO ESTAN EN LA PUERTA, Y NO DEBEN ESTARLO.
# El workflow instala SOLO el grupo dev: `--all-extras` arrastraba torch, CUDA y OCR
# —varios GB y muy por encima del presupuesto de 90 s—. Asi que el resultado de `mypy`
# no puede depender de si estan instaladas, y sin esto dependia:
#
#   · SIN los extras -> 7 errores `import-not-found`, la puerta roja en CI y en
#     cualquier clon. Tres commits en rojo sin que nadie lo mirara.
#   · CON los extras -> los `# type: ignore[import-untyped]` en linea eran necesarios.
#
# O sea que los ignores en linea fallaban en LAS DOS direcciones segun el entorno:
# sobraban cuando la biblioteca estaba y no bastaban cuando no estaba. Esto lo hace
# declarativo y estable: la puerta deja de medir la maquina y vuelve a medir el repo.
#
# `implicit_reexport` es por `camelot.read_pdf`, que con camelot INSTALADO da
# «does not explicitly export attribute». Sin la biblioteca ese error no existe, asi
# que hacen falta las dos claves para cubrir los dos entornos.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pymupdf4llm.*", "camelot.*", "torch.*", "docling.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
# `-n auto` desde L5. Para medir en serie sobre el MISMO arbol, sin moverlo:
#     PYTEST_ADDOPTS="-n 0" make fast
addopts = "-q --strict-markers --strict-config -n auto"
# `pytest` a secas NO debe recoger tests/e2e, que necesita red.
# La puerta rapida nombra sus directorios explicitamente; ver el Makefile.
testpaths = ["tests/unit"]
markers = ["slow: necesita red o Docker"]

[tool.hatch.build.targets.wheel]
packages = ["src/docbench_es"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
