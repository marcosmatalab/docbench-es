name: fast
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # setup-uv@v6, no @v3: la v3 NO acepta `python-version` y lo ignoraba con un
      # `##[warning] Unexpected input(s)` en cada corrida, o sea que el pin no
      # estaba donde el fichero decia (corrida 32531009942).
      # Y aqui NO se repite la version a proposito: la fuente unica es
      # `.python-version`, que `uv` respeta al crear el entorno. Duplicarla en el
      # `with:` seria un segundo sitio del que se puede separar en silencio. Quien
      # convierte el pin en promesa cumplida es el paso de abajo.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Sin esto la clave usa el glob por defecto, `**/*requirements*.txt`,
          # que en este repo no casa con NADA: la cache no dependeria de las
          # dependencias reales y sobreviviria a un cambio de `uv.lock`.
          cache-dependency-glob: uv.lock
      # SOLO el grupo dev. `--all-extras` arrastraba torch, CUDA y OCR: varios GB
      # y muy por encima del presupuesto de 90 s de la puerta rapida.
      - run: uv sync --only-group dev
      # El pin es una PROMESA: que CI y local analizan el mismo Python. Aqui se
      # comprueba en vez de suponerse, porque `requires-python = ">=3.12"` deja
      # pasar un 3.13 el dia que `ubuntu-latest` cambie su Python por defecto, y
      # mypy analizaria otra cosa que en local sin que nadie se entere.
      - name: CI corre el Python de .python-version
        run: |
          esperado=$(tr -d '[:space:]' < .python-version)
          real=$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "esperado=$esperado real=$real"
          [ "$esperado" = "$real" ] || { echo "::error::CI corre $real, .python-version dice $esperado"; exit 1; }
      # La cache de mypy, y NO la de hypothesis. Al cerrar L2 el reparto del
      # crecimiento de la puerta estaba medido: de los +2090 ms de L1, 1284 eran
      # `mypy --strict` tipando tambien `tests/`. Ese es el sitio donde tocar
      # cuando aprieta, y por eso se cachea. `hypothesis` NO se cachea a
      # proposito: su base guarda lo ya explorado, asi que cachearla haria que CI
      # buscase menos, y el verde de CI vale justo porque nace limpio y explora
      # mas que un local en caliente (docs/metrics.md).
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      # La puerta es UNA sola definicion, la del Makefile. Repetir aqui sus pasos
      # garantiza que local y CI se separen con el tiempo.
      #
      # DOS umbrales, y hacen cosas distintas a proposito (ADR-0022):
      #   - 90 s es el presupuesto del MANUAL (§15). Pasarse BLOQUEA.
      #   - TECHO_MS es la alarma de CRECIMIENTO, re-justificada en cada hito a
      #     partir de la medicion del anterior. Pasarse AVISA, no bloquea.
      # El techo no bloquea porque un runner lento pondria la puerta roja por el
      # motivo equivocado, y una puerta que se pone roja por motivos equivocados
      # enseña a ignorar el color. Bloquear se reserva para la promesa publicada.
      - name: la puerta, cronometrada contra su techo
        env:
          TECHO_MS: 20000
        run: |
          inicio=$(date +%s%N)
          make fast
          fin=$(date +%s%N)
          ms=$(( (fin - inicio) / 1000000 ))
          echo "puerta: ${ms} ms · techo de crecimiento ${TECHO_MS} ms · presupuesto del manual 90000 ms"
          echo "puerta_ms=${ms}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ms" -gt 90000 ]; then
            echo "::error::La puerta tardo ${ms} ms y §15 del manual dice 90000. Esto es una promesa publicada rota."
            exit 1
          fi
          if [ "$ms" -gt "$TECHO_MS" ]; then
            echo "::warning::La puerta tardo ${ms} ms y el techo de crecimiento es ${TECHO_MS}. No bloquea, pero el proximo /cerrar tiene que re-justificar el techo o gastar una palanca. Ver ADR-0022."
          fi
